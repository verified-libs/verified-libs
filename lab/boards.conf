# Boards on lib-lab1 and the switchable USB port each one sits on.
# Used by lab/tools/boardpower.sh. Keep it in step with the cables.
#
# Hubs are named by USB serial number; boardpower.sh finds their bus location
# (1-1, 1-2, ...) at run time, so moving the monitor's cable to another laptop
# port needs no change here. Dell U2415 #1 has two TI TUSB8041 hubs:
#   4B0708619185  upstream hub: ports 1, 2, 3 really cut VBUS (tested 2026-11-07)
#                 port 4 = cascade to 3B0708619185: NEVER switch
#   3B0708619185  downstream hub: ports 1 and 2 cut data only, VBUS stays on
#                 (not usable for power cycling; monitor #2 chains into port 2,
#                 since 2026-11-11)
# Dell U2415 #2, chained from 3B0708619185 port 2:
#   9E0C0069B5FA  upstream hub: ports 1, 2 and 3 really cut VBUS (tested
#                 2026-11-11 with RAM markers on the SAM D20, H723ZG and
#                 Pico 2: lost after 5 s off), port 4 = cascade to EE0C0869B5FA: NEVER switch
#   EE0C0869B5FA  downstream hub of monitor #2: untested
#
# firmware board = the common/<board> directory the firmware is built for.
#
# name       hub serial     port  probe vid:pid  probe serial   firmware board
# nrf5340dk: the J-Link OB reports PID 1366:1065 since 2026-11-15 (1055
# before; its USB configuration changed while the board was in other use)
nrf5340dk    4B0708619185   1     1366:1065      000960122443   nrf5340
nucleo-g0b1re 4B0708619185  2     0483:374b      0673FF565382515067232957 stm32g0b1
nucleo-g474re 4B0708619185  3     0483:374e      002100483335510133383531 stm32g474
nucleo-h723zg 9E0C0069B5FA  2     0483:374e      0042001E3335511835383531 stm32h723
# sam-d20-xpro: use OpenOCD, never probe-rs 0.32 (no SAM D20 target; EDBG HID packet-size
# error, and a failed probe-rs attempt wedged the EDBG until replugged).
sam-d20-xpro  9E0C0069B5FA  1     03eb:2111      ATML1873040200009960 samd20
# pico2: Raspberry Pi Pico 2 H (RP2350) on port 3, debugged through the Raspberry Pi Debug
# Probe (firmware updated 2026-11-11), which sits on the data-only hub EE0C0869B5FA port 1
# and is not power-cycled. The probe columns name the Debug Probe; "separate-probe" tells
# boardpower.sh so. No firmware board layer yet.
pico2         9E0C0069B5FA  3     2e8a:000c      E6654854570A5826 rp2350 separate-probe
