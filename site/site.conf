# Site build configuration (read by build.py).
# Repository URL used for links to files in the repo: the public repository
# (DECISIONS 2026-11-19). The links work from the day it is published.
REPO_URL=https://github.com/verified-libs/verified-libs/blob/main
# Findings that may be published (maintainer told, and the 90 days are over
# or the maintainer agreed). Directory names under verify/findings/.
PUBLISH_FINDINGS=diffstorm-cb-overwrite-padding
# The address the site is served at: canonical links, sitemap.xml and robots.txt
# (for search engines). Leave empty for a build that is not that site.
SITE_URL=https://verified-libs.org
# Visit counting with GoatCounter (cookieless; https://www.goatcounter.com/help/privacy): the site
# code (letters, digits, hyphens). Empty: the pages hold no third-party script at all. Set: every page
# but 404.html gets GoatCounter's script at the end of its body and a sentence in its footer.
GOATCOUNTER_CODE=verified-libs
